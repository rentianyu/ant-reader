<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>蚁读 · RSS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body data-view="sources">
  <!-- ======================= 登录 / 初始化 ======================= -->
  <section id="auth-view" class="auth" hidden>
    <div class="auth-inner">
      <div class="auth-logo">蚁读</div>
      <div class="auth-sub" id="auth-sub">输入访问密码</div>
      <form id="auth-form" class="auth-form" autocomplete="on">
        <input id="auth-pass" type="password" class="input" placeholder="访问密码" autocomplete="current-password" />
        <input id="auth-pass2" type="password" class="input" placeholder="确认密码" autocomplete="new-password" hidden />
        <button class="btn primary block" id="auth-submit" type="submit">进入</button>
      </form>
      <div class="auth-err" id="auth-err"></div>
      <div class="auth-foot">自托管 RSS 阅读器 · Ant Reader</div>
    </div>
  </section>

  <!-- ======================= 主界面 ======================= -->
  <div id="main-view" class="shell" hidden>
    <header class="topbar">
      <div class="brand">蚁读</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-markall" title="把当前列表全部标为已读" aria-label="全部已读">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-add" title="添加订阅" aria-label="添加订阅">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-menu" title="菜单" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>

      <div class="menu" id="menu" hidden>
        <button class="menu-item" data-act="manage">整理订阅</button>
        <button class="menu-item" data-act="starred">我的收藏</button>
        <button class="menu-item" data-act="opml-export">导出 OPML</button>
        <button class="menu-item" data-act="opml-import">导入 OPML</button>
        <button class="menu-item" data-act="refresh">立即刷新</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-act="theme">夜间模式</button>
        <button class="menu-item" data-act="settings">账号设置</button>
        <button class="menu-item danger" data-act="logout">退出登录</button>
      </div>
    </header>

    <main class="layout">
      <!-- -------- 订阅源 -------- -->
      <aside class="pane pane-sources" id="pane-sources">
        <div class="src-scroll" id="src-list">
          <div class="ptr" id="ptr-src"><span class="ptr-icon">↓</span><span class="ptr-text">下拉刷新</span></div>
          <div id="src-container"></div>
        </div>
      </aside>

      <!-- -------- 文章列表 -------- -->
      <section class="pane pane-list" id="pane-list">
        <div class="list-head">
          <button class="icon-btn sm back" id="btn-back" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="list-title" id="list-title">全部文章</div>
          <button class="icon-btn sm" id="btn-feed-info" title="订阅源信息" aria-label="订阅源信息" hidden>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="icon-btn sm" id="btn-refresh" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 5v6h-6"/></svg>
          </button>
        </div>
        <div class="segbar" id="segbar">
          <button class="seg-item on" data-filter="all">全部</button>
          <button class="seg-item" data-filter="unread">未读</button>
          <button class="seg-item" data-filter="starred">收藏</button>
        </div>
        <div class="item-scroll" id="item-list">
          <div class="ptr" id="ptr"><span class="ptr-icon">↓</span><span class="ptr-text">下拉刷新</span></div>
          <div id="item-container"></div>
        </div>
        <div class="list-more" id="list-more" hidden>
          <button class="btn ghost block" id="btn-more">加载更多</button>
          <div class="latest-tip" id="latest-tip" hidden>— 已是最新一篇 · 向上滚动看更早 —</div>
        </div>
      </section>

      <!-- -------- 阅读 -------- -->
      <article class="pane pane-reader" id="pane-reader">
        <div class="reader-head">
          <button class="icon-btn sm back" id="btn-reader-back" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="reader-head-right">
            <button class="icon-btn sm" id="btn-star" title="收藏" aria-label="收藏">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-open" title="在浏览器打开原文" aria-label="打开原文">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
            </button>
            <button class="icon-btn sm" id="btn-markread" title="标记未读/已读" aria-label="切换已读">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 13l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
            </button>
          </div>
        </div>
        <div class="reader-scroll" id="reader-scroll">
          <div class="reader-body" id="reader-body">
            <div class="empty">选择一篇文章开始阅读</div>
          </div>
        </div>
      </article>
    </main>
  </div>

  <!-- ======================= 添加订阅 ======================= -->
  <div class="modal" id="modal-add" hidden>
    <div class="modal-mask" data-close="add"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3>添加订阅</h3>
        <button class="icon-btn sm" data-close="add" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="label">RSS / Atom / 站点地址</span>
          <input id="add-url" class="input" placeholder="https://example.com/feed.xml" />
        </label>
        <label class="field">
          <span class="label">分组（可选）</span>
          <select id="add-group" class="input"></select>
        </label>
        <div class="hint">填站点首页也行，会自动发现订阅源。</div>
        <div class="add-preview" id="add-preview" hidden></div>
        <div class="modal-err" id="add-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-close="add">取消</button>
        <button class="btn primary" id="btn-add-submit">添加</button>
      </div>
    </div>
  </div>

  <!-- ======================= 整理订阅 ======================= -->
  <div class="modal wide" id="modal-manage" hidden>
    <div class="modal-mask" data-close="manage"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3>整理订阅</h3>
        <button class="icon-btn sm" data-close="manage" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="manage-groups">
          <div class="manage-row">
            <input id="new-group" class="input" placeholder="新建分组名" />
            <button class="btn primary sm" id="btn-new-group">新建</button>
          </div>
          <div class="chips" id="group-chips"></div>
        </div>
        <div class="manage-feeds" id="manage-feeds"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-close="manage">完成</button>
      </div>
    </div>
  </div>

  <!-- ======================= 设置 ======================= -->
  <div class="modal" id="modal-settings" hidden>
    <div class="modal-mask" data-close="settings"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3>账号设置</h3>
        <button class="icon-btn sm" data-close="settings" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="label">自动刷新间隔（分钟）</span>
          <input id="set-interval" class="input" type="number" min="5" max="720" step="5" />
        </label>
        <div class="hint">定时抓取由 Cloudflare Cron 执行，默认每 30 分钟轮转一批订阅源。</div>
        <div class="divider"></div>
        <div class="field">
          <span class="label">修改访问密码</span>
          <input id="set-oldpass" class="input" type="password" placeholder="原密码" autocomplete="current-password" />
          <input id="set-newpass" class="input mt8" type="password" placeholder="新密码（至少 4 位）" autocomplete="new-password" />
        </div>
        <div class="modal-err" id="set-err"></div>
        <div class="divider"></div>
        <div class="stat-line" id="stat-line"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-close="settings">取消</button>
        <button class="btn primary" id="btn-save-settings">保存</button>
      </div>
    </div>
  </div>

  <!-- ======================= 订阅源信息 ======================= -->
  <div class="modal" id="modal-feed" hidden>
    <div class="modal-mask" data-close="feed"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3>订阅源信息</h3>
        <button class="icon-btn sm" data-close="feed" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="label">名称</span>
          <input id="feed-name" class="input" placeholder="订阅名称" />
        </label>
        <label class="field">
          <span class="label">分组</span>
          <select id="feed-group" class="input"></select>
        </label>
        <div class="field">
          <span class="label">订阅地址</span>
          <input id="feed-url" class="input" readonly />
        </div>
        <div class="feed-stats" id="feed-stats"></div>
        <div class="modal-err" id="feed-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-close="feed">取消</button>
        <button class="btn primary" id="btn-save-feed">保存</button>
      </div>
    </div>
  </div>

  <input type="file" id="opml-file" accept=".opml,.xml,text/xml" hidden />
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
